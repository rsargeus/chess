name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  # Needs repo secrets to actually pass — see the list in
  # e2e/README.md (or SPEC.md § Testing). Runs unconditionally so a
  # missing secret shows up as a clear, self-explanatory failure
  # (connection refused / login failure) rather than being silently
  # skipped forever.
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_MANAGEMENT_CLIENT_ID: ${{ secrets.AUTH0_MANAGEMENT_CLIENT_ID }}
      AUTH0_MANAGEMENT_CLIENT_SECRET: ${{ secrets.AUTH0_MANAGEMENT_CLIENT_SECRET }}
      AUTH0_PREMIUM_ROLE_ID: ${{ secrets.AUTH0_PREMIUM_ROLE_ID }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      FRONTEND_URL: http://localhost:5173
      DISABLE_RATE_LIMITING: 'true'
      PLAYWRIGHT_USER1_EMAIL: ${{ secrets.PLAYWRIGHT_USER1_EMAIL }}
      PLAYWRIGHT_USER1_PASSWORD: ${{ secrets.PLAYWRIGHT_USER1_PASSWORD }}
      PLAYWRIGHT_USER2_EMAIL: ${{ secrets.PLAYWRIGHT_USER2_EMAIL }}
      PLAYWRIGHT_USER2_PASSWORD: ${{ secrets.PLAYWRIGHT_USER2_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: backend
        run: nohup npm run dev > backend.log 2>&1 &

      - name: Start frontend
        working-directory: frontend
        run: nohup npm run dev > frontend.log 2>&1 &

      - name: Wait for servers
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health && break; sleep 2; done
          for i in $(seq 1 30); do curl -sf http://localhost:5173 && break; sleep 2; done

      - name: Run e2e tests
        working-directory: e2e
        run: npm test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            backend/backend.log
            frontend/frontend.log
            e2e/test-results/

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
